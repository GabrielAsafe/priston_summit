[Companion]
; Decimal item CODE that should act as the companion crystal.
; 0 = item interception disabled; /companion commands still work.
; Point this at an item whose PotionCount is 100, like the legacy summon crystals.
CrystalItemCode=0

; Server-authoritative companion lifetime. Valid range: 10..1440 minutes.
LifetimeMinutes=720

; Buffered offline EXP flush interval. Valid range: 5..300 seconds.
ExpFlushSeconds=30
