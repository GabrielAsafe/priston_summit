services:
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: summittale-dbadmin
    restart: unless-stopped
    depends_on:
      - mssql
    ports:
      - "8978:8978"
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: summittale-mssql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "SummitTale@12345"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - summittale_mssql:/var/opt/mssql
      - ./db:/db


volumes:
  summittale_mssql:
